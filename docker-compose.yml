services:
  vault:
    image: hashicorp/vault:1.16
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: vaultadmin-local-only
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"

  app:
    build: ./app
    depends_on:
      - vault
      - postgres
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_ROLE_ID_FILE: "/run/secrets/role_id"
      VAULT_SECRET_ID_FILE: "/run/secrets/secret_id"
    volumes:
      - ./vault/output:/run/secrets:ro
